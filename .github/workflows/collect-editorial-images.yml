name: Validate and collect editorial service photographs
on:
  pull_request:
    branches: [main]
jobs:
  photo-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate and encode licensed free stock assets
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import urllib.request,base64,time
          files={
            "flights":"photo-1628186844945-c621ddeca8f8",
            "visa":"photo-1526778548025-fa2f459cd5c1",
            "corporate":"photo-1497366811353-6870744d04b2",
            "holidays":"photo-1533105079780-92b9be482077"
          }
          for name,photo in files.items():
            url="https://images.unsplash.com/"+photo+"?fm=webp&fit=crop&w=800&h=1050&q=84"
            req=urllib.request.Request(url,headers={"User-Agent":"SapphireQuestWebsite/1.0"})
            with urllib.request.urlopen(req, timeout=45) as response:
              data=response.read()
              ctype=response.headers.get("Content-Type")
            assert len(data)>20000 and len(data)<2000000, (name,len(data))
            assert data.startswith(b"RIFF") and data[8:12]==b"WEBP", (name,ctype,data[:12])
            print("PHOTO_BEGIN|"+name+"|"+str(len(data)))
            print(base64.b64encode(data).decode())
            print("PHOTO_END|"+name)
            print("OK "+name+" "+str(len(data))+" bytes",flush=True)
          PY
