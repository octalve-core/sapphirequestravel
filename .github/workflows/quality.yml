name: Validate Sapphire Quest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - name: Validate complete flight journey payloads
        run: pnpm exec tsx scripts/check-flight-enquiries.ts
      - name: Validate enquiry itinerary detail parsing
        run: pnpm exec tsx scripts/check-enquiry-itinerary.ts
      - name: Validate reporting periods and trend aggregates
        run: pnpm exec tsx scripts/check-report-math.ts
      - name: Validate transactional email templates
        run: pnpm exec tsx scripts/check-email-templates.ts
      - name: Validate first-owner bootstrap without credentials
        shell: bash
        run: |
          set +e
          output="$(pnpm run bootstrap:admin 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -q "Set DATABASE_URL" <<< "$output"
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
