name: Refresh public-domain airport directory
# Initial one-time generation on feature branch; re-run manually for periodic updates.
on:
  push:
    branches: [feat/flight-enquiry-overhaul]
    paths:
      - 'scripts/refresh-airports.py'
      - '.github/workflows/refresh-airports.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified airport index
        run: python scripts/refresh-airports.py
      - name: Commit directory snapshot if updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/airport-directory.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public-domain global airport directory'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
